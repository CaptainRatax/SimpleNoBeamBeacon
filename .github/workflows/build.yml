name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: bash ./gradlew clean build

      - name: Upload server plugin
        uses: actions/upload-artifact@v4
        with:
          name: SimpleNoBeamBeacon
          path: |
            bukkit/build/libs/SimpleNoBeamBeacon-Bukkit-*.jar
            sponge/build/libs/SimpleNoBeamBeacon-Sponge-26.2-*.jar
            !bukkit/build/libs/*-sources.jar
            !sponge/build/libs/*-sources.jar
